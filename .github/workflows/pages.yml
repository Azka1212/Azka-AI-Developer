name: Sync projects and deploy portfolio

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NEXT_PUBLIC_BASE_PATH: /Azka-AI-Developer
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@v4
        with:
          path: lib/github-projects.json
          key: github-sync-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: github-sync-
      - name: Sync public projects and READMEs
        run: npm run sync:github
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/cache/save@v4
        with:
          path: lib/github-projects.json
          key: github-sync-${{ github.run_id }}-${{ github.run_attempt }}
      - run: npm run test:sync
      - run: npx tsc --noEmit
      - run: npm run build
      - run: mkdir -p out && touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
